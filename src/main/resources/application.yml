spring:
  application.name: pulse-queue
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pulse_queue}
    username: ${DATABASE_USER:pulse}
    password: ${DATABASE_PASSWORD:pulse}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
queue:
  worker-enabled: ${QUEUE_WORKER_ENABLED:true}
  poll-ms: ${QUEUE_POLL_MS:250}
  retry-poll-ms: ${QUEUE_RETRY_POLL_MS:1000}
  # Orphan recovery. The grace period must stay well above poll-ms, or the
  # reaper republishes healthy jobs that are merely waiting their turn.
  orphan-sweep-ms: ${QUEUE_ORPHAN_SWEEP_MS:15000}
  orphan-grace-ms: ${QUEUE_ORPHAN_GRACE_MS:30000}
